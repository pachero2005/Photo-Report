name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
          accept-android-sdk-licenses: true

      - name: Build with Buildozer
        run: |
          # Forzar a que Buildozer apunte a la ruta correcta del SDK de Android del runner
          export ANDROIDSDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"
          
          # Asegurar que sdkmanager instale todo lo necesario en la ruta activa
          sdkmanager --sdk_root="$ANDROIDSDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

          # Verificar que aidl exista y sea ejecutable antes de compilar
          test -x "$ANDROIDSDK/build-tools/34.0.0/aidl"

          # Compilar con Buildozer
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-release-apk
          path: bin/*.apk
