name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          # Aceptar licencias antes de instalar paquetes
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          # Instalar herramientas necesarias en el SDK del entorno
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Asegurar que aidl tenga permisos de ejecución
          chmod +x "$SDK_ROOT/build-tools/34.0.0/aidl"

          # Validación diagnóstica previa a la compilación
          test -f "$SDK_ROOT/build-tools/34.0.0/aidl"
          test -x "$SDK_ROOT/build-tools/34.0.0/aidl"

          # Exportar todas las variables de entorno necesarias para Buildozer
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROIDSDK=$SDK_ROOT"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
          } >> "$GITHUB_ENV"

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-release-apk
          path: bin/*.apk
